[project]
name = "evopolicygym-benchmark-dm-control"
version = "0.1.0"
description = "The DeepMind Control Suite benchmarking tasks for EvoPolicyGym."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "EvoPolicyGym contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "evopolicygym==0.3.*",
    "dm-control==1.0.43",
    "pillow>=12.1.1,<13",
    # dm-control 1.0.43 is generated against MuJoCo 3.10's mjData layout.
    # MuJoCo 3.11 removes qM, which its generated indexer still reads.
    "mujoco>=3.10.0,<3.11",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "ruff>=0.12.0",
]

[tool.uv]
required-version = "==0.11.16"

[tool.uv.sources]
evopolicygym = { path = "../../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dm_control_benchmarks"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_configs = true
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
