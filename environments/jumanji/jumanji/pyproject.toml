[project]
name = "evopolicygym-benchmark-jumanji"
version = "0.1.0"
description = "The single-policy Jumanji task suite for EvoPolicyGym."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "EvoPolicyGym contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "evopolicygym==0.3.*",
    "jumanji==1.1.1",
    # v1.1.1 updated its suite for JAX 0.5 but leaves JAX unbounded; Tetris
    # no longer resets once JAX removes the a_min/a_max clip keywords.
    "jax==0.5.*",
    # Jumanji imports its Sokoban generator at package import time, but 1.1.1
    # omits this runtime dependency from its wheel metadata.
    "requests==2.32.*",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "ruff>=0.12.0",
]

[tool.uv]
required-version = "==0.11.16"

[tool.uv.sources]
evopolicygym = { path = "../../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/jumanji_benchmarks"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
