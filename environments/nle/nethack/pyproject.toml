[project]
name = "evopolicygym-benchmark-nle-nethack"
version = "0.1.0"
description = "The deterministic NLE NetHackScore Benchmark for EvoPolicyGym."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "EvoPolicyGym contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "evopolicygym==0.3.*",
    "nle==1.3.0",
    "numpy>=2,<3",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
agent-tools = [
    "imageio>=2.37,<3",
    "imageio-ffmpeg>=0.6,<0.7",
    "pillow>=12,<13",
]
dev = [
    "mypy==2.3.0",
    "ruff>=0.12.0",
]

[tool.uv]
required-version = "==0.11.16"

[tool.uv.sources]
evopolicygym = { path = "../../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nle_benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
"skills/optimize-nethack-policy" = "nle_benchmarks/skills/optimize-nethack-policy"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/scripts",
    "/skills",
    "/src",
    "/tests",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_configs = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["nle", "nle.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
